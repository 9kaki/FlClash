name: android apk

on:
  workflow_dispatch:
    inputs:
      arch:
        description: 'Target ABI'
        type: choice
        default: all
        options:
          - all
          - arm64
          - arm
          - amd64
      app_env:
        description: 'App environment (pre shows the banner, stable does not)'
        type: choice
        default: pre
        options:
          - pre
          - stable
      sign:
        description: 'required fails fast when a signing secret is missing, auto builds unsigned'
        type: choice
        default: required
        options:
          - required
          - auto
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep these in step with .github/workflows/build.yaml.
  FLUTTER_VERSION: '3.47.6'
  NDK_VERSION: r28c

jobs:
  apk:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      # Left empty the build falls back to the debug key and the .dev package
      # id, so a fork's APK sits beside an installed release instead of
      # replacing it. Set KEYSTORE, KEY_ALIAS, STORE_PASSWORD and KEY_PASSWORD
      # as repository secrets to sign it as a release build.
      KEYSTORE: ${{ secrets.KEYSTORE }}
      SIGN_INPUT: ${{ inputs.sign }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # Say which of the two package ids this run will produce before spending
      # an hour building. Print character counts, not "is it set": a secret that
      # resolves to an empty string looks identical to a set one from here.
      - name: Report signing mode
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "KEYSTORE:       ${#KEYSTORE} chars"
          echo "KEY_ALIAS:      ${#KEY_ALIAS} chars"
          echo "STORE_PASSWORD: ${#STORE_PASSWORD} chars"
          echo "KEY_PASSWORD:   ${#KEY_PASSWORD} chars"
          missing=()
          for name in KEYSTORE KEY_ALIAS STORE_PASSWORD KEY_PASSWORD; do
            [[ -n "${!name:-}" ]] || missing+=("$name")
          done
          if [[ "${#missing[@]}" -gt 0 ]]; then
            if [[ "${SIGN_INPUT:-required}" == 'required' ]]; then
              echo "::error::${missing[*]} resolve to empty strings, so Gradle would fall back to the debug key and the com.follow.myclash.dev package id. Add them under Settings -> Secrets and variables -> Actions -> Repository secrets; secrets stored in an Environment are not visible to this job. Or run with sign=auto to build unsigned anyway."
              exit 1
            fi
            echo "::warning::${missing[*]} resolve to empty strings. This run ships com.follow.myclash.dev and cannot upgrade an earlier install."
          else
            echo "Signed build: the apk carries com.follow.myclash and can upgrade an earlier install."
          fi

      # Written straight after checkout, since checkout cleans the tree, and
      # into key.properties rather than local.properties: that one belongs to
      # the Flutter tool and is rewritten on every build.
      - name: Setup Android signing
        if: env.KEYSTORE != ''
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          echo "$KEYSTORE" | base64 --decode > android/app/keystore.jks
          {
            echo "storeFile=keystore.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties
          echo "keystore: $(wc -c < android/app/keystore.jks) bytes"
          echo "key.properties:"
          awk -F= '{printf "  %s=%d chars\n", $1, length($2)}' android/key.properties

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Setup NDK
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: true
          link-to-sdk: true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      # The Core embeds this bundle and FlClashHttpOverrides.trustCoreRoots
      # loads it for Dart. Pinned by hash, so a new bundle from
      # https://curl.se/docs/caextract.html is a reviewed bump.
      - name: Fetch CA certificates
        shell: bash
        env:
          CA_BUNDLE: cacert-2026-09-25.pem
          CA_BUNDLE_SHA256: a41b5d356aea97a529fe27e0f7316d2f9d946d75927476cf9cf1b90637d00505
        run: |
          bundle=core/Clash.Meta/component/ca/ca-certificates.crt
          mkdir -p "$(dirname "$bundle")"
          curl -fsSL --retry 3 -o "$bundle" "https://curl.se/ca/$CA_BUNDLE"
          echo "$CA_BUNDLE_SHA256  $bundle" | sha256sum -c -

      - name: Install dependencies
        run: flutter pub get

      # setup.dart activates flutter_distributor with pub global; its bin
      # directory is not on PATH by default.
      - name: Put pub global executables on PATH
        run: echo "${PUB_CACHE:-$HOME/.pub-cache}/bin" >> "$GITHUB_PATH"

      # A keystore that only looks right is worse than none at all: Gradle
      # silently falls back to the debug key and the .dev package id, and the
      # build still goes green. Open the key here, before the build, so a bad
      # secret stops the run with a reason instead of a mystery package id.
      - name: Verify the signing key
        if: env.KEYSTORE != ''
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          set -euo pipefail
          if ! keytool -list -v -alias "$KEY_ALIAS" \
            -keystore android/app/keystore.jks \
            -storepass "$STORE_PASSWORD"; then
            echo "::error::Could not open the decoded keystore with KEY_ALIAS and STORE_PASSWORD. Re-copy myclash-release.b64 into the KEYSTORE secret and check the other three; a bad value here is exactly what pushes Gradle onto the debug key and the .dev package id."
            exit 1
          fi

      # Ask Gradle itself what it resolved, since the files being present is
      # not the same as the release build type picking them up. The probe is
      # installed as an init script, so the real build's own configuration
      # phase prints the answer into its log.
      - name: Install a Gradle probe
        if: env.KEYSTORE != ''
        run: |
          cat > probe.gradle <<'EOF'
          gradle.projectsEvaluated {
            def app = gradle.rootProject.findProject(':app')
            if (app == null) {
              println "PROBE app project not found"
            } else {
              def store = new File(app.projectDir, 'keystore.jks')
              def props = new java.util.Properties()
              for (name in ['key.properties', 'local.properties']) {
                def f = new File(gradle.rootProject.projectDir, name)
                if (f.exists()) { f.withInputStream { props.load(it) } }
              }
              println "PROBE keystoreExists=${store.exists()} bytes=${store.exists() ? store.length() : -1}"
              println "PROBE signingKeys=[${props.stringPropertyNames().findAll { it in ['storeFile', 'storePassword', 'keyAlias', 'keyPassword'] }.sort().join(', ')}]"
              try {
                app.android.buildTypes.each { bt ->
                  println "PROBE buildType=${bt.name} signing=${bt.signingConfig?.name} suffix=${bt.applicationIdSuffix}"
                }
              } catch (Throwable t) {
                println "PROBE androidExtensionFailed ${t.class.name}: ${t.message}"
              }
            }
          }
          EOF
          for d in "${GRADLE_USER_HOME:-$HOME/.gradle}" "$HOME/.gradle"; do
            mkdir -p "$d/init.d"
            cp probe.gradle "$d/init.d/probe.gradle"
          done
          rm probe.gradle

      # setup.dart drives the Go core, the Rust library and flutter_distributor,
      # and writes the APKs to dist/. A tag without a prerelease suffix is a
      # stable build, which is what drops the PRE banner.
      - name: Build APK
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          ARCH: ${{ inputs.arch }}
          ENV_INPUT: ${{ inputs.app_env }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* && "$GITHUB_REF_NAME" != *-* ]]; then
            app_env=stable
          else
            app_env="${ENV_INPUT:-pre}"
          fi
          args=(android --env "$app_env")
          if [[ -n "$ARCH" && "$ARCH" != 'all' ]]; then
            args+=(--arch "$ARCH")
          fi
          echo "APP_ENV=$app_env" >> "$GITHUB_ENV"
          echo "building for $app_env"
          dart setup.dart "${args[@]}"

      # The package id and the signing key decide whether an upgrade installs
      # over the previous build, so print them instead of guessing.
      - name: Verify package id
        id: package
        env:
          SIGNED: ${{ env.KEYSTORE != '' }}
        run: |
          build_tools="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          for apk in dist/*.apk; do
            echo "$apk"
            "$build_tools/aapt" dump badging "$apk" | sed -n '1p'
          done
          first="$(ls dist/*.apk | head -1)"
          package="$("$build_tools/aapt" dump badging "$first" |
            sed -n "1s/^package: name='\([^']*\)'.*/\1/p")"
          "$build_tools/apksigner" verify --print-certs "$first" |
            grep -E "certificate DN|SHA-256" | head -2

          # dist/ names each apk FlClash-<version>-android-<abi>.apk, so the
          # artifact can carry the same shape plus what tells two runs apart.
          base="$(basename "$first" .apk)"
          if [[ "$(ls dist/*.apk | wc -l)" != '1' ]]; then
            base="$(printf '%s' "$base" | sed -E 's/-android-.*$/-android-all-abi/')"
          fi
          artifact="$base-${APP_ENV}-$(printf '%s' "$GITHUB_SHA" | cut -c1-7).apk"

          echo "package=$package" >> "$GITHUB_OUTPUT"
          echo "artifact=$artifact" >> "$GITHUB_OUTPUT"
          echo "**Package id:** \`$package\`" >> "$GITHUB_STEP_SUMMARY"
          echo "**Artifact:** \`$artifact\`" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$SIGNED" == 'true' && "$package" == *.dev ]]; then
            echo "::error::Signing secrets are set but the apk still ships $package, so Gradle never saw android/key.properties or android/app/keystore.jks. Check the PROBE lines above for what it resolved."
            exit 1
          fi
          if [[ "$SIGNED" != 'true' ]]; then
            echo "::warning::Unsigned build: the package id carries the .dev suffix and the key is a throwaway debug key, so this APK cannot upgrade an earlier install. Add KEYSTORE, KEY_ALIAS, STORE_PASSWORD and KEY_PASSWORD to ship com.follow.myclash."
          fi

      - name: Show artifacts
        run: ls -lh dist && sha256sum dist/*.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.artifact }}
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 14

      # Only a signed build is worth publishing; an unsigned one carries the
      # debug key and the .dev package id.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') && env.KEYSTORE != ''
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          prerelease: ${{ contains(github.ref_name, '-') }}
